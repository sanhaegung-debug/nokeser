<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>노크세르 기숙사 - 마법해금 & 연금술 연구소</title>
  <style>
    :root {
      --bg-color: #1a1813;
      --card-bg: #26231b;
      --accent-color: #f1c40f;
      --accent-hover: #d4ac0d;
      --text-color: #f5f0e6;
      --border-color: #3d3728;
    }

    body {
      font-family: 'Noto Sans KR', sans-serif;
      background-color: var(--bg-color);
      color: var(--text-color);
      margin: 0;
      padding: 15px;
    }

    .container {
      max-width: 1100px;
      margin: 0 auto;
    }

    .header {
      text-align: center;
      border-bottom: 2px solid var(--border-color);
      padding-bottom: 15px;
      margin-bottom: 15px;
    }

    .header h1 {
      color: var(--accent-color);
      margin: 0 0 5px 0;
      font-size: 26px;
    }

    .user-bar {
      display: flex;
      justify-content: flex-end;
      gap: 8px;
      margin-bottom: 15px;
      font-size: 0.85em;
      flex-wrap: wrap;
      align-items: center;
    }

    .tab-menu {
      display: flex;
      gap: 5px;
      margin-bottom: 20px;
      border-bottom: 1px solid var(--border-color);
      padding-bottom: 10px;
      overflow-x: auto;
      white-space: nowrap;
    }

    .tab-btn {
      background-color: var(--card-bg);
      color: var(--text-color);
      border: 1px solid var(--border-color);
      padding: 8px 16px;
      border-radius: 6px;
      cursor: pointer;
      font-weight: bold;
      font-size: 0.9em;
      flex-shrink: 0;
    }

    .tab-btn.active {
      background-color: var(--accent-color);
      color: #1a1813;
      border-color: var(--accent-color);
    }

    .tab-content {
      display: none;
    }

    .tab-content.active {
      display: block;
    }

    .filter-search-bar {
      display: flex;
      gap: 10px;
      margin-bottom: 15px;
      flex-wrap: wrap;
      align-items: center;
    }

    .element-sub-tabs {
      display: flex;
      gap: 6px;
      overflow-x: auto;
      white-space: nowrap;
      padding-bottom: 5px;
      flex: 1;
    }

    .element-sub-btn, .status-sub-btn {
      background-color: #14120e;
      color: #aaa;
      border: 1px solid var(--border-color);
      padding: 6px 14px;
      border-radius: 20px;
      cursor: pointer;
      font-size: 0.85em;
      font-weight: bold;
      flex-shrink: 0;
      transition: all 0.2s;
    }
    .element-sub-btn.active, .status-sub-btn.active {
      background-color: var(--accent-color);
      color: #1a1813;
      border-color: var(--accent-color);
    }

    .search-input-box {
      min-width: 240px;
      flex: 0.5;
    }

    .search-input-box input {
      margin-bottom: 0;
      padding: 7px 12px;
      border-radius: 20px;
      font-size: 13px;
    }

    /* 진척도 패널 */
    .progress-panel {
      background-color: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      padding: 12px 18px;
      margin-bottom: 20px;
      font-size: 0.9em;
    }
    .progress-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(130px, 1fr));
      gap: 10px;
      margin-top: 8px;
    }
    .progress-item {
      background: rgba(20, 18, 14, 0.5);
      padding: 8px 10px;
      border-radius: 6px;
      border: 1px solid var(--border-color);
      text-align: center;
    }

    .card {
      background-color: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      padding: 15px;
      margin-bottom: 15px;
    }

    input, textarea, select {
      width: 100%;
      padding: 10px;
      margin-bottom: 10px;
      background-color: #14120e;
      border: 1px solid var(--border-color);
      color: var(--text-color);
      border-radius: 4px;
      box-sizing: border-box;
      font-size: 14px;
    }

    button {
      background-color: var(--accent-color);
      color: #1a1813;
      border: none;
      padding: 8px 16px;
      border-radius: 4px;
      cursor: pointer;
      font-weight: bold;
      font-size: 0.9em;
    }

    button:hover { background-color: var(--accent-hover); }
    .btn-secondary { background-color: #4a5568; color: #fff; }
    .btn-danger { background-color: #e53e3e; color: #fff; }

    .action-bar {
      margin-bottom: 15px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 10px;
    }

    .grid-container {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
      gap: 18px;
    }

    .magic-card {
      background-color: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 18px;
      position: relative;
      display: flex;
      flex-direction: column;
      box-shadow: 0 4px 6px rgba(0,0,0,0.3);
      transition: transform 0.2s, border-color 0.2s;
      cursor: pointer;
    }
    .magic-card:hover {
      border-color: var(--accent-color);
      transform: translateY(-2px);
    }
    .magic-card.completed {
      border-color: #319795;
      background-color: rgba(49, 151, 149, 0.05);
    }

    .card-title {
      font-size: 18px;
      font-weight: bold;
      color: #fff;
      margin-bottom: 4px;
    }

    .card-subtitle {
      font-size: 12px;
      color: #b8af9c;
      margin-bottom: 12px;
      border-bottom: 1px solid var(--border-color);
      padding-bottom: 8px;
    }

    .badge {
      display: inline-block;
      padding: 3px 10px;
      border-radius: 20px;
      font-size: 11px;
      font-weight: bold;
      margin-bottom: 8px;
      width: fit-content;
    }
    .badge-바람 { background-color: #319795; color: #fff; }
    .badge-화염 { background-color: #dd6b20; color: #fff; }
    .badge-물 { background-color: #3182ce; color: #fff; }
    .badge-대지 { background-color: #276749; color: #fff; }
    .badge-빛 { background-color: #d69e2e; color: #000; }
    .badge-어둠 { background-color: #4a5568; color: #fff; }
    .badge-연금술 { background-color: #e67e22; color: #1a1813; }

    .info-box {
      background-color: rgba(20, 18, 14, 0.6);
      border-radius: 6px;
      padding: 10px;
      margin-top: auto;
      font-size: 13px;
    }

    .info-row {
      margin-bottom: 4px;
      color: #cbd5e0;
      display: flex;
      justify-content: space-between;
    }
    .info-row span {
      color: #fff;
      font-weight: bold;
      text-align: right;
    }

    .ingredients-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 6px;
      margin-bottom: 10px;
    }
    .ingredients-grid input {
      margin-bottom: 0;
      font-size: 12px;
      padding: 6px;
    }

    .ingredient-tag {
      display: inline-block;
      background: #3d3728;
      color: #f5f0e6;
      font-size: 11px;
      padding: 3px 8px;
      border-radius: 4px;
      margin: 2px;
    }

    /* 선물 표 스타일 */
    .gift-table-container {
      overflow-x: auto;
      border-radius: 8px;
      border: 1px solid var(--border-color);
      background-color: var(--card-bg);
    }
    .gift-table {
      width: 100%;
      border-collapse: collapse;
      color: var(--text-color);
      text-align: left;
      font-size: 14px;
    }
    .gift-table th {
      background-color: #14120e;
      color: var(--accent-color);
      padding: 12px 16px;
      font-weight: bold;
      border-bottom: 2px solid var(--border-color);
    }
    .gift-table td {
      padding: 12px 16px;
      border-bottom: 1px solid var(--border-color);
      vertical-align: middle;
      line-height: 1.5;
    }
    .gift-table tbody tr:hover {
      background-color: rgba(241, 196, 15, 0.05);
    }
    .gift-item-name {
      font-weight: bold;
      color: #fff;
    }
    .gift-prof-badge {
      display: inline-block;
      background-color: #3d3728;
      color: var(--accent-color);
      padding: 4px 10px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: bold;
    }
    .gift-action-btn {
      background: transparent;
      border: 1px solid var(--border-color);
      color: #b8af9c;
      padding: 3px 8px;
      font-size: 12px;
      border-radius: 4px;
      cursor: pointer;
      margin-left: 4px;
    }
    .gift-action-btn:hover {
      background-color: var(--accent-color);
      color: #1a1813;
    }

    .modal {
      display: none;
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.85);
      justify-content: center;
      align-items: center;
      z-index: 1000;
      padding: 15px;
      box-sizing: border-box;
    }

    .modal-content {
      background: var(--card-bg);
      padding: 20px;
      border-radius: 8px;
      width: 100%;
      max-width: 500px;
      max-height: 90vh;
      overflow-y: auto;
      border: 1px solid var(--border-color);
    }

    .card-action-btns {
      position: absolute;
      top: 15px;
      right: 15px;
      display: flex;
      gap: 5px;
      z-index: 10;
    }

    .card-action-btns button {
      background: rgba(0,0,0,0.4);
      border: 1px solid var(--border-color);
      color: #cbd5e0;
      cursor: pointer;
      font-size: 11px;
      padding: 3px 8px;
      border-radius: 4px;
    }
    .card-action-btns button:hover { background-color: var(--accent-color); color: #1a1813; }

    .checkbox-container {
      margin-top: 12px;
      background: rgba(241, 196, 15, 0.1);
      border: 1px dashed var(--accent-color);
      padding: 8px 10px;
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 13px;
    }

    .inline-edit-box {
      background: #14120e;
      border: 1px solid var(--accent-color);
      border-radius: 8px;
      padding: 12px;
      margin-top: 10px;
    }
  </style>

  <!-- Firebase SDK 로드 및 설정 -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getFirestore, collection, getDocs, addDoc, deleteDoc, doc, updateDoc, setDoc, getDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyCYvLbL_2gBmZhdN9npfhzrZbmUYLE4SG0",
      authDomain: "nokser-1d179.firebaseapp.com",
      projectId: "nokser-1d179",
      storageBucket: "nokser-1d179.firebasestorage.app",
      messagingSenderId: "596115112365",
      appId: "1:596115112365:web:98656d46f3cf923959a124",
      measurementId: "G-N80ZJKEM5B"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    window.db = db;
    window.collection = collection;
    window.getDocs = getDocs;
    window.addDoc = addDoc;
    window.deleteDoc = deleteDoc;
    window.doc = doc;
    window.updateDoc = updateDoc;
    window.setDoc = setDoc;
    window.getDoc = getDoc;

    window.dispatchEvent(new Event('firebase-ready'));
  </script>
</head>
<body>

  <div class="container">
    <div class="header">
      <h1>✨ 노크세르 기숙사 연구소</h1>
      <p style="font-size: 0.9em; margin: 5px 0 0 0; color: #b8af9c;">SOOP 마인크래프트 서버 '차카데미' 노크세르 기숙사 전용 공유소</p>
    </div>

    <div class="user-bar">
      <span id="userInfoDisplay" style="align-self: center; margin-right: auto; color: var(--accent-color);">✨ 접속 중...</span>
      <button onclick="openLoginModal()" class="btn-secondary">👤 사용자 변경</button>
      <button id="btnOpenRegister" onclick="tryOpenRegisterForm()">+ 정보 등록</button>
    </div>

    <div class="tab-menu">
      <button class="tab-btn active" onclick="switchTab('magic', event)">🔮 마법해금 조건 공유</button>
      <button class="tab-btn" onclick="switchTab('alchemy', event)">🧪 연금술 조합법 공유</button>
      <button class="tab-btn" onclick="switchTab('gift', event)">🎁 교수별 선물 공략</button>
      <button class="tab-btn" onclick="switchTab('notice', event)">📢 공지사항</button>
    </div>

    <!-- 1. 마법해금 조건 공유 탭 -->
    <div id="tab-magic" class="tab-content active">
      
      <!-- 내 진척도 패널 (전체 총 합산 표시 추가) -->
      <div id="progressPanel" class="progress-panel">
        <div style="font-weight: bold; color: var(--accent-color); margin-bottom: 5px; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 5px;">
          <span id="progressTitle">📊 내 마법 해금 진척도</span>
          <span id="totalProgressSummary" style="background: rgba(241, 196, 15, 0.15); padding: 3px 10px; border-radius: 12px; font-size: 0.9em; border: 1px solid var(--accent-color);">총 해금: 0 / 0개 (0%)</span>
        </div>
        <div class="progress-grid" id="progressGrid"></div>
      </div>

      <div class="filter-search-bar">
        <div class="element-sub-tabs">
          <button class="element-sub-btn active" onclick="setElementFilter('all', this)">🌪️ 전체</button>
          <button class="element-sub-btn" onclick="setElementFilter('바람', this)">💨 바람</button>
          <button class="element-sub-btn" onclick="setElementFilter('화염', this)">🔥 화염</button>
          <button class="element-sub-btn" onclick="setElementFilter('물', this)">💧 물</button>
          <button class="element-sub-btn" onclick="setElementFilter('대지', this)">🌍 대지</button>
          <button class="element-sub-btn" onclick="setElementFilter('빛', this)">✨ 빛</button>
          <button class="element-sub-btn" onclick="setElementFilter('어둠', this)">🌑 어둠</button>
        </div>
      </div>

      <div class="filter-search-bar">
        <div style="display: flex; gap: 6px; flex-wrap: wrap;">
          <button class="status-sub-btn active" onclick="setStatusFilter('all', this)">📌 전체 보기</button>
          <button class="status-sub-btn" onclick="setStatusFilter('completed', this)">✅ 해금된 마법</button>
          <button class="status-sub-btn" onclick="setStatusFilter('uncompleted', this)">❌ 미해금 마법</button>
        </div>
        <div class="search-input-box">
          <input type="text" id="magicSearchInput" placeholder="🔍 마법 이름, 재료 검색..." oninput="renderMagics()">
        </div>
      </div>

      <!-- 마법 신규 등록 폼 -->
      <div id="form-magic-card" class="card" style="display:none;">
        <h4 style="color:var(--accent-color); margin-top:0;">새 마법해금 정보 등록</h4>
        <input type="text" id="magTitle" placeholder="마법 이름 (예: 파이어볼 2단계)">
        <select id="magElement">
          <option value="바람">💨 바람 속성</option>
          <option value="화염">🔥 화염 속성</option>
          <option value="물">💧 물 속성</option>
          <option value="대지">🌍 대지 속성</option>
          <option value="빛">✨ 빛 속성</option>
          <option value="어둠">🌑 어둠 속성</option>
        </select>
        <input type="text" id="magMaterials" placeholder="필요 재료 (예: 마력 결정 5개)">
        <input type="text" id="magLocation" placeholder="해금 조건 (예: 네더 요새에서 몬스터 50마리 처치)">
        <textarea id="magDesc" rows="3" placeholder="상세 공략 및 주의사항 (선택사항)"></textarea>

        <div style="display:flex; gap:8px; margin-top:10px;">
          <button onclick="saveNewMagic()">등록하기</button>
          <button class="btn-secondary" onclick="closeMagicForm()">취소</button>
        </div>
      </div>

      <div id="magicGrid" class="grid-container"></div>
    </div>

    <!-- 2. 연금술 조합법 공유 탭 -->
    <div id="tab-alchemy" class="tab-content">
      <div class="filter-search-bar">
        <div class="search-input-box" style="flex:1;">
          <input type="text" id="alcSearchInput" placeholder="🔍 연금술 완성품, 스트리머, 필요 재료 검색..." oninput="renderAlchemys()">
        </div>
      </div>

      <!-- 연금술 신규 등록 폼 -->
      <div id="form-alc-card" class="card" style="display:none;">
        <h4 style="color:var(--accent-color); margin-top:0;">새 연금술 조합법 등록</h4>
        <input type="text" id="alcTitle" placeholder="완성품 / 포션 이름 (예: 상급 체력 포션)">
        <input type="text" id="alcAuthor" placeholder="스트리머 닉네임" readonly style="background:#14120e; color:#b8af9c;">
        
        <label style="font-size: 0.85em; color: #b8af9c; display: block; margin-top: 5px;">조합 재료 (최대 9가지):</label>
        <div class="ingredients-grid">
          <input type="text" id="alcMat1" placeholder="재료 1">
          <input type="text" id="alcMat2" placeholder="재료 2">
          <input type="text" id="alcMat3" placeholder="재료 3">
          <input type="text" id="alcMat4" placeholder="재료 4">
          <input type="text" id="alcMat5" placeholder="재료 5">
          <input type="text" id="alcMat6" placeholder="재료 6">
          <input type="text" id="alcMat7" placeholder="재료 7">
          <input type="text" id="alcMat8" placeholder="재료 8">
          <input type="text" id="alcMat9" placeholder="재료 9">
        </div>

        <textarea id="alcDesc" rows="3" placeholder="효과 및 제작 팁 / 주의사항 (선택사항)"></textarea>
        
        <label style="font-size: 0.85em; color: #b8af9c; display: block; margin-top: 5px;">인증 이미지 URL 링크 직접 입력:</label>
        <input type="text" id="alcImgUrl" placeholder="https://example.com/image.jpg">

        <label style="font-size: 0.85em; color: #b8af9c; display: block; margin-top: 5px;">또는 파일 선택 (직접 업로드):</label>
        <input type="file" id="alcFile" accept="image/*" style="margin-top:2px;">

        <div style="display:flex; gap:8px; margin-top:10px;">
          <button onclick="saveNewAlchemy()">등록하기</button>
          <button class="btn-secondary" onclick="closeAlcForm()">취소</button>
        </div>
      </div>

      <div id="alcGrid" class="grid-container"></div>
    </div>

    <!-- 3. 🎁 교수별 선물 공략 탭 -->
    <div id="tab-gift" class="tab-content">
      <div class="filter-search-bar">
        <div class="search-input-box" style="flex:1;">
          <input type="text" id="giftSearchInput" placeholder="🔍 아이템 이름, 설명, 교수님 이름 검색..." oninput="renderGifts()">
        </div>
      </div>

      <!-- 선물 정보 신규 등록 폼 -->
      <div id="form-gift-card" class="card" style="display:none;">
        <h4 style="color:var(--accent-color); margin-top:0;">새 교수 선물 공략 등록</h4>
        <input type="text" id="giftItemName" placeholder="아이템 이름 (예: 반짝이는 허브)">
        <input type="text" id="giftProfessor" placeholder="선물 대상 교수 (예: 하르바 교수)">
        <textarea id="giftDesc" rows="3" placeholder="아이템 설명 및 획득방법 (예: 숲 속 깊은 동굴에서 채집 가능)"></textarea>
        
        <div style="display:flex; gap:8px; margin-top:10px;">
          <button onclick="saveNewGift()">등록하기</button>
          <button class="btn-secondary" onclick="closeGiftForm()">취소</button>
        </div>
      </div>

      <!-- 가로 표(Table) 영역 -->
      <div class="gift-table-container">
        <table class="gift-table">
          <thead>
            <tr>
              <th style="width: 25%;">아이템 이름</th>
              <th style="width: 50%;">아이템 설명</th>
              <th style="width: 25%;">선물 대상 교수</th>
            </tr>
          </thead>
          <tbody id="giftTableBody"></tbody>
        </table>
      </div>
    </div>

    <!-- 4. 공지사항 탭 -->
    <div id="tab-notice" class="tab-content">
      <div class="action-bar">
        <h3>기숙사 공지사항</h3>
      </div>
      <div id="noticeList"></div>
    </div>
  </div>

    async function loadSession() {
      const saved = sessionStorage.getItem('knoxer_streamer');
      if (saved) {
        currentStreamer = saved;

        updateAuthDisplay();
        await loadAllData();
        renderAll();
      } else {

    function updateAuthDisplay() {

      if (currentStreamer) {
        display.innerHTML = `✨ <b>${currentStreamer}</b>님 접속 중`;
      }

    async function loadAllData() {
      try {
        const mSnap = await getDocs(collection(window.db, "knoxer_magics"));
        store.magics = mSnap.docs.map(d => ({ firestoreId: d.id, ...d.data() })).sort((a,b) => b.id - a.id);

        const aSnap = await getDocs(collection(window.db, "knoxer_alchemys"));
        store.alchemys = aSnap.docs.map(d => ({ firestoreId: d.id, ...d.data() })).sort((a,b) => b.id - a.id);

        const gSnap = await getDocs(collection(window.db, "knoxer_gifts"));
        store.gifts = gSnap.docs.map(d => ({ firestoreId: d.id, ...d.data() })).sort((a,b) => b.id - a.id);

        const nSnap = await getDocs(collection(window.db, "knoxer_notices"));
        store.notices = nSnap.docs.map(d => ({ firestoreId: d.id, ...d.data() })).sort((a,b) => b.id - a.id);

          await loadMyCompletions();

        console.error("데이터 로딩 실패:", e);

    async function loadMyCompletions() {
      if(!currentStreamer) return;
      try {
        const docRef = doc(window.db, "knoxer_user_progress", currentStreamer);
        const docSnap = await getDoc(docRef);
        if (docSnap.exists()) {
          store.myCompletions = docSnap.data().completions || {};
        } else {
          store.myCompletions = {};
        }
      } catch(e) {
        console.error("진척도 로딩 실패:", e);
      }

      document.getElementById('checkSecretPw').value = '';
      if(currentStreamer) {
        document.getElementById('streamerSelect').value = currentStreamer;
      }
      document.getElementById('loginModal').style.display = 'flex';
    }

    async function verifyStreamerLogin() {
      const selected = document.getElementById('streamerSelect').value;
      const pwInput = document.getElementById('checkSecretPw').value.trim();

      if(!selected) {
        alert("본인의 스트리머 닉네임을 선택해주세요.");
        return;
      }
      if (pwInput !== STREAMER_PASSWORD) {
        alert("스트리머 비밀번호가 틀렸습니다.");

      }

      document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
      document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));

      if(isCompleted) {

      } else {

      try {

        await setDoc(docRef, { completions: store.myCompletions }, { merge: true });
      } catch (e) {

      }

      renderAll();
    }

    function compressImage(file) {
      return new Promise((resolve) => {
        const reader = new FileReader();
        reader.readAsDataURL(file);
        reader.onload = (event) => {
          const img = new Image();
          img.src = event.target.result;
          img.onload = () => {
            const canvas = document.createElement('canvas');
            const MAX_WIDTH = 800; const MAX_HEIGHT = 800;
            let width = img.width; let height = img.height;
            if (width > height) {
              if (width > MAX_WIDTH) { height *= MAX_WIDTH / width; width = MAX_WIDTH; }
            } else {
              if (height > MAX_HEIGHT) { width *= MAX_HEIGHT / height; height = MAX_HEIGHT; }
            }
            canvas.width = width; canvas.height = height;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(img, 0, 0, width, height);
            resolve(canvas.toDataURL('image/jpeg', 0.7));
          };
        };
      });
    }

    function escapeHtml(str) {
      if(!str) return '';
      return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#039;");
    }

    function renderAll() {
      renderProgressPanel();
      renderMagics();
      renderAlchemys();
      renderGifts();
      renderNotices();
    }

    function renderProgressPanel() {
      const grid = document.getElementById('progressGrid');
      document.getElementById('progressTitle').innerText = `📊 ${currentStreamer}님의 속성별 마법 해금 진척도`;
      grid.innerHTML = '';

      // 전체 마법 개수 및 내가 해금한 전체 개수 계산
      const totalMagics = store.magics.length;
      const totalCompleted = store.magics.filter(m => store.myCompletions[m.firestoreId]).length;
      const totalPercent = totalMagics > 0 ? Math.round((totalCompleted / totalMagics) * 100) : 0;
      
      document.getElementById('totalProgressSummary').innerText = `총 해금: ${totalCompleted} / ${totalMagics}개 (${totalPercent}%)`;

      const elements = ['바람', '화염', '물', '대지', '빛', '어둠'];
      elements.forEach(el => {
        const total = store.magics.filter(m => m.element === el).length;
        const completed = store.magics.filter(m => m.element === el && store.myCompletions[m.firestoreId]).length;
        const percent = total > 0 ? Math.round((completed / total) * 100) : 0;

        grid.innerHTML += `
          <div class="progress-item">
            <div style="font-size: 12px; color: #b8af9c; margin-bottom: 2px;">${el}</div>
            <div style="font-weight: bold; font-size: 15px; color: #fff;">${completed} / ${total} <span style="font-size:11px; color:var(--accent-color);">(${percent}%)</span></div>
          </div>
        `;
      });
    }

    function renderMagics() {
      const grid = document.getElementById('magicGrid');
      const searchKeyword = document.getElementById('magicSearchInput') ? document.getElementById('magicSearchInput').value.toLowerCase().trim() : '';
      grid.innerHTML = '';

      let filtered = store.magics.filter(m => {
        const matchElement = (currentElementFilter === 'all' || m.element === currentElementFilter);
        const matchSearch = (!searchKeyword || 
          (m.title && m.title.toLowerCase().includes(searchKeyword)) || 
          (m.materials && m.materials.toLowerCase().includes(searchKeyword)) ||
          (m.location && m.location.toLowerCase().includes(searchKeyword))
        );
        
        const isCompleted = !!store.myCompletions[m.firestoreId];
        let matchStatus = true;
        if(currentStatusFilter === 'completed') matchStatus = isCompleted;
        if(currentStatusFilter === 'uncompleted') matchStatus = !isCompleted;

        return matchElement && matchSearch && matchStatus;
      });

      if(filtered.length === 0) {
        grid.innerHTML = `<p style="color:#777; grid-column: 1/-1; text-align:center;">조건에 일치하는 마법 해금 조건이 없습니다.</p>`;
        return;
      }

      filtered.forEach(m => {
        const elType = m.element || '바람';
        const isCompleted = !!store.myCompletions[m.firestoreId];
        const isEditing = (editingId === m.firestoreId);

        if (isEditing) {
          grid.innerHTML += `
            <div class="magic-card" style="border-color: var(--accent-color);">
              <span class="badge badge-${elType}">수정 모드</span>
              <div class="inline-edit-box">
                <input type="text" id="edit_title_${m.firestoreId}" value="${escapeHtml(m.title)}" placeholder="마법 이름">
                <select id="edit_element_${m.firestoreId}">
                  <option value="바람" ${m.element==='바람'?'selected':''}>💨 바람 속성</option>
                  <option value="화염" ${m.element==='화염'?'selected':''}>🔥 화염 속성</option>
                  <option value="물" ${m.element==='물'?'selected':''}>💧 물 속성</option>
                  <option value="대지" ${m.element==='대지'?'selected':''}>🌍 대지 속성</option>
                  <option value="빛" ${m.element==='빛'?'selected':''}>✨ 빛 속성</option>
                  <option value="어둠" ${m.element==='어둠'?'selected':''}>🌑 어둠 속성</option>
                </select>
                <input type="text" id="edit_materials_${m.firestoreId}" value="${escapeHtml(m.materials)}" placeholder="필요 재료">
                <input type="text" id="edit_location_${m.firestoreId}" value="${escapeHtml(m.location)}" placeholder="해금 조건">
                <textarea id="edit_desc_${m.firestoreId}" rows="2" placeholder="상세 공략">${escapeHtml(m.description)}</textarea>
                
                <div style="display:flex; gap:6px; margin-top:8px;">
                  <button onclick="saveInlineEdit('${m.firestoreId}', event)" style="flex:1; padding:6px;">저장</button>
                  <button class="btn-secondary" onclick="cancelInlineEdit(event)" style="flex:1; padding:6px;">취소</button>
                </div>
              </div>
            </div>
          `;
        } else {
          grid.innerHTML += `
            <div class="magic-card ${isCompleted ? 'completed' : ''}" onclick="openDetailModal('magic', '${m.firestoreId}', event)">
              <div class="card-action-btns">
                <button onclick="startInlineEdit('${m.firestoreId}', event)">수정</button>
                <button onclick="deleteMagic('${m.firestoreId}', event)" style="color:#fc8181;">삭제</button>
              </div>
              <span class="badge badge-${elType}">${elType} 속성</span>
              <div class="card-title" style="margin-right: 80px;">${escapeHtml(m.title)}</div>
              <div class="card-subtitle">최종 수정자: ${escapeHtml(m.author)} | ${m.date || '-'}</div>
              <div class="info-box">
                <div class="info-row">필요 재료: <span>${escapeHtml(m.materials || '미입력')}</span></div>
                <div class="info-row">해금 조건: <span>${escapeHtml(m.location || '미입력')}</span></div>
              </div>
              ${m.description ? `<div style="font-size:13px; color:#cbd5e0; margin-top:10px; white-space:pre-wrap; line-height: 1.4; overflow:hidden; text-overflow:ellipsis; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical;">${escapeHtml(m.description)}</div>` : ''}
              
              <div class="checkbox-container" onclick="toggleCompletion('${m.firestoreId}', event)" style="cursor:pointer;">
                <span>🏆 내 해금 완료 체크</span>
                <input type="checkbox" ${isCompleted ? 'checked' : ''} style="width:18px; height:18px; cursor:pointer; margin-bottom:0;" onclick="event.stopPropagation(); toggleCompletion('${m.firestoreId}', event)">
              </div>
            </div>
          `;
        }
      });
    }

    function renderAlchemys() {
      const grid = document.getElementById('alcGrid');
      const searchKeyword = document.getElementById('alcSearchInput') ? document.getElementById('alcSearchInput').value.toLowerCase().trim() : '';
      grid.innerHTML = '';

      let filtered = store.alchemys.filter(a => {
        const matString = Array.isArray(a.materials) ? a.materials.join(' ') : (a.materials || '');
        return (!searchKeyword || 
          (a.title && a.title.toLowerCase().includes(searchKeyword)) || 
          (a.author && a.author.toLowerCase().includes(searchKeyword)) || 
          (matString.toLowerCase().includes(searchKeyword))
        );
      });

      if(filtered.length === 0) {
        grid.innerHTML = `<p style="color:#777; grid-column: 1/-1; text-align:center;">조건에 일치하는 연금술 조합법이 없습니다.</p>`;
        return;
      }

      filtered.forEach(a => {
        const isEditing = (editingAlcId === a.firestoreId);
        const matList = Array.isArray(a.materials) ? a.materials : [];

        if (isEditing) {
          let inputsHtml = '';
          for(let i=1; i<=9; i++) {
            const val = matList[i-1] || '';
            inputsHtml += `<input type="text" id="edit_alc_mat_${a.firestoreId}_${i}" value="${escapeHtml(val)}" placeholder="재료 ${i}">`;
          }

          grid.innerHTML += `
            <div class="magic-card" style="border-color: var(--accent-color);">
              <span class="badge badge-연금술">수정 모드</span>
              <div class="inline-edit-box">
                <input type="text" id="edit_alc_title_${a.firestoreId}" value="${escapeHtml(a.title)}" placeholder="완성품 이름">
                <label style="font-size: 0.8em; color: #b8af9c;">조합 재료 (최대 9개):</label>
                <div class="ingredients-grid">${inputsHtml}</div>
                <textarea id="edit_alc_desc_${a.firestoreId}" rows="2" placeholder="효과 및 팁">${escapeHtml(a.description)}</textarea>
                <input type="text" id="edit_alc_imgUrl_${a.firestoreId}" value="${escapeHtml(a.image && a.image.startsWith('http') ? a.image : '')}" placeholder="인증 이미지 URL 링크">
                
                <div style="display:flex; gap:6px; margin-top:8px;">
                  <button onclick="saveAlcInlineEdit('${a.firestoreId}', event)" style="flex:1; padding:6px;">저장</button>
                  <button class="btn-secondary" onclick="cancelAlcInlineEdit(event)" style="flex:1; padding:6px;">취소</button>
                </div>
              </div>
            </div>
          `;
        } else {
          let tagsHtml = matList.map(m => `<span class="ingredient-tag">🧪 ${escapeHtml(m)}</span>`).join('');
          if(!tagsHtml) tagsHtml = `<span style="color:#777; font-size:12px;">등록된 재료 없음</span>`;

          grid.innerHTML += `
            <div class="magic-card" onclick="openDetailModal('alchemy', '${a.firestoreId}', event)">
              <div class="card-action-btns">
                <button onclick="startAlcInlineEdit('${a.firestoreId}', event)">수정</button>
                <button onclick="deleteAlchemy('${a.firestoreId}', event)" style="color:#fc8181;">삭제</button>
              </div>
              <span class="badge badge-연금술">🧪 연금술</span>
              <div class="card-title" style="margin-right: 80px;">${escapeHtml(a.title)}</div>
              <div class="card-subtitle">최종 수정자: ${escapeHtml(a.author)} | ${a.date}</div>
              
              <div style="margin-top: 8px; margin-bottom: 8px;">
                <div style="font-size: 12px; color: #b8af9c; margin-bottom: 4px;">조합 재료 (총 ${matList.length}개):</div>
                <div style="display: flex; flex-wrap: wrap; gap: 2px;">${tagsHtml}</div>
              </div>

              ${a.description ? `<div style="font-size:13px; color:#cbd5e0; margin-top:8px; white-space:pre-wrap; line-height: 1.4; overflow:hidden; text-overflow:ellipsis; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical;">${escapeHtml(a.description)}</div>` : ''}
            </div>
          `;
        }
      });
    }

    function renderGifts() {
      const tbody = document.getElementById('giftTableBody');
      const searchKeyword = document.getElementById('giftSearchInput') ? document.getElementById('giftSearchInput').value.toLowerCase().trim() : '';
      tbody.innerHTML = '';

      let filtered = store.gifts.filter(g => {
        return (!searchKeyword || 
          (g.itemName && g.itemName.toLowerCase().includes(searchKeyword)) || 
          (g.professor && g.professor.toLowerCase().includes(searchKeyword)) || 
          (g.description && g.description.toLowerCase().includes(searchKeyword))
        );
      });

      if(filtered.length === 0) {
        tbody.innerHTML = `<tr><td colspan="3" style="text-align:center; color:#777; padding:20px;">조건에 일치하는 교수 선물 공략이 없습니다.</td></tr>`;
        return;
      }

      filtered.forEach(g => {
        const isEditing = (editingGiftId === g.firestoreId);

        if (isEditing) {
          tbody.innerHTML += `
            <tr style="background-color: #201d16;">
              <td><input type="text" id="edit_gift_item_${g.firestoreId}" value="${escapeHtml(g.itemName)}" placeholder="아이템 이름" style="margin:0;"></td>
              <td><textarea id="edit_gift_desc_${g.firestoreId}" rows="2" placeholder="아이템 설명" style="margin:0;">${escapeHtml(g.description)}</textarea></td>
              <td>
                <input type="text" id="edit_gift_prof_${g.firestoreId}" value="${escapeHtml(g.professor)}" placeholder="선물 대상 교수" style="margin-bottom:5px;">
                <div style="display:flex; gap:4px;">
                  <button onclick="saveGiftInlineEdit('${g.firestoreId}', event)" style="padding:4px 8px; font-size:12px;">저장</button>
                  <button class="btn-secondary" onclick="cancelGiftInlineEdit(event)" style="padding:4px 8px; font-size:12px;">취소</button>
                </div>
              </td>
            </tr>
          `;
        } else {
          tbody.innerHTML += `
            <tr>
              <td class="gift-item-name">📦 ${escapeHtml(g.itemName)}</td>
              <td style="color:#cbd5e0; white-space:pre-wrap;">${escapeHtml(g.description || '-')}</td>
              <td>
                <span class="gift-prof-badge">👨‍🏫 ${escapeHtml(g.professor)}</span>
                <div style="display:inline-block; margin-left:6px;">
                  <button class="gift-action-btn" onclick="startGiftInlineEdit('${g.firestoreId}', event)">수정</button>
                  <button class="gift-action-btn" onclick="deleteGift('${g.firestoreId}', event)" style="color:#fc8181;">삭제</button>
                </div>
              </td>
            </tr>
          `;
        }
      });
    }

    function renderNotices() {
      const nList = document.getElementById('noticeList');
      nList.innerHTML = store.notices.length === 0 ? `<p style="color:#777; text-align:center;">등록된 공지사항이 없습니다.</p>` : '';
      store.notices.forEach(n => {
        nList.innerHTML += `
          <div class="card">
            <h4 style="margin:0 0 5px 0; color:var(--accent-color);">${escapeHtml(n.title)}</h4>
            <div style="font-size:11px; color:#b8af9c; margin-bottom:8px;">${n.date}</div>
            <div style="font-size:14px; white-space:pre-wrap;">${escapeHtml(n.content)}</div>
          </div>
        `;
      });
    }
  </script>
</body>
</html>
