<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>노크세르 기숙사 연구소</title>

  <!-- 파이어베이스 v8 SDK -->
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>

  <style>
    /* 기본 테마 및 레이아웃 */
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: #121212;
      color: #e0e0e0;
      font-family: 'Noto Sans KR', sans-serif;
      padding: 20px;
    }

    header {
      text-align: center;
      margin-bottom: 25px;
    }
    header h1 {
      color: #ffca28;
      font-size: 2rem;
      margin-bottom: 5px;
    }
    header p {
      color: #aaa;
      font-size: 0.95rem;
    }

    /* 탭 메뉴 버튼 */
    .tab-menu {
      display: flex;
      justify-content: center;
      gap: 10px;
      margin-bottom: 20px;
      flex-wrap: wrap;
    }
    .tab-btn {
      background-color: #2a2a2a;
      color: #aaa;
      border: 1px solid #444;
      padding: 10px 18px;
      border-radius: 8px;
      cursor: pointer;
      font-weight: bold;
      transition: all 0.2s ease;
    }
    .tab-btn:hover {
      background-color: #333;
      color: #fff;
    }
    .tab-btn.active {
      background-color: #ffca28;
      color: #121212;
      border-color: #ffca28;
    }

    /* 섹션 공통 */
    .content-section {
      display: none;
      max-width: 1000px;
      margin: 0 auto;
      background: #1e1e1e;
      padding: 20px;
      border-radius: 12px;
      border: 1px solid #333;
    }
    .content-section.active {
      display: block;
    }

    .section-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 15px;
      flex-wrap: wrap;
      gap: 10px;
    }
    .section-header h2 {
      font-size: 1.3rem;
      color: #fff;
    }

    /* 버튼 스타일 */
    .register-btn {
      background-color: #ffca28;
      color: #121212;
      border: none;
      padding: 8px 14px;
      border-radius: 6px;
      font-weight: bold;
      cursor: pointer;
    }
    .register-btn:hover { background-color: #e6b800; }

    /* 검색 바 */
    .search-input {
      width: 100%;
      padding: 10px 14px;
      border-radius: 6px;
      border: 1px solid #444;
      background: #2a2a2a;
      color: #fff;
      font-size: 0.95rem;
      margin-bottom: 15px;
    }
    .search-input:focus {
      outline: none;
      border-color: #ffca28;
    }

    /* 🎁 교수별 선물 공략 - 가로 표(Table) 스타일 */
    .gift-table-container {
      overflow-x: auto;
    }
    .gift-table {
      width: 100%;
      border-collapse: collapse;
      background-color: #1a1a1a;
      color: #e0e0e0;
      border-radius: 8px;
      overflow: hidden;
      text-align: left;
    }
    .gift-table th {
      background-color: #2c2c2c;
      color: #ffca28;
      padding: 12px 16px;
      font-weight: bold;
      border-bottom: 2px solid #333;
    }
    .gift-table td {
      padding: 12px 16px;
      border-bottom: 1px solid #2a2a2a;
      vertical-align: middle;
      line-height: 1.5;
    }
    .gift-table tbody tr:hover {
      background-color: #262626;
    }

    .item-name-text { font-weight: bold; color: #fff; }
    .item-desc-text { color: #ccc; }
    .prof-badge {
      display: inline-block;
      background-color: #2d3748;
      color: #81e6d9;
      padding: 4px 10px;
      border-radius: 6px;
      font-size: 0.88rem;
      font-weight: bold;
    }

    /* 모달 팝업 스타일 */
    .modal-backdrop {
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.75);
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 1000;
    }
    .modal-box {
      background: #252525;
      padding: 24px;
      border-radius: 12px;
      width: 100%;
      max-width: 450px;
      border: 1px solid #444;
    }
    .modal-box h3 { margin-bottom: 15px; color: #ffca28; }
    .modal-box input, .modal-box textarea {
      width: 100%;
      padding: 10px;
      margin-bottom: 12px;
      border-radius: 6px;
      border: 1px solid #444;
      background: #181818;
      color: #fff;
    }
    .modal-box textarea { height: 90px; resize: vertical; }
    .modal-btns {
      display: flex;
      justify-content: flex-end;
      gap: 10px;
    }
    .btn-cancel {
      background: #444; color: #fff; border: none;
      padding: 8px 14px; border-radius: 6px; cursor: pointer;
    }
    .btn-save {
      background: #ffca28; color: #121212; border: none;
      padding: 8px 14px; border-radius: 6px; font-weight: bold; cursor: pointer;
    }

    /* 카드 리스트 스타일 (기존 마법, 연금술 탭용) */
    .card-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 15px;
    }
    .data-card {
      background: #252525;
      border: 1px solid #333;
      border-radius: 8px;
      padding: 15px;
    }
    .data-card h4 { color: #ffca28; margin-bottom: 8px; }
    .data-card p { font-size: 0.9rem; color: #bbb; }
  </style>
</head>
<body>

  <header>
    <h1>✨ 노크세르 기숙사 연구소</h1>
    <p>SOOP 마인크래프트 서버 '차카데미' 노크세르 기숙사 전용 공유소</p>
  </header>

  <!-- 상단 탭 메뉴 -->
  <div class="tab-menu">
    <button class="tab-btn active" onclick="switchTab('magicSection', this)">🪄 마법해금 조건 공유</button>
    <button class="tab-btn" onclick="switchTab('alchemySection', this)">🧪 연금술 조합법 공유</button>
    <button class="tab-btn" onclick="switchTab('giftSection', this)">🎁 교수별 선물 공략</button>
  </div>

  <!-- 1. 마법해금 섹션 -->
  <div id="magicSection" class="content-section active">
    <div class="section-header">
      <h2>노크세르 마법 해금 리스트</h2>
    </div>
    <div id="magicCardGrid" class="card-grid">
      <!-- 마법 데이터 출력 영역 -->
    </div>
  </div>

  <!-- 2. 연금술 섹션 -->
  <div id="alchemySection" class="content-section">
    <div class="section-header">
      <h2>노크세르 연금술 조합 리스트</h2>
    </div>
    <div id="alchemyCardGrid" class="card-grid">
      <!-- 연금술 데이터 출력 영역 -->
    </div>
  </div>

  <!-- 3. 🎁 교수별 선물 공략 섹션 (가로 표 형식) -->
  <div id="giftSection" class="content-section">
    <div class="section-header">
      <h2>🎁 마법 교수별 선물 & 아이템 공략</h2>
      <button class="register-btn" onclick="openGiftModal()">+ 선물 정보 등록</button>
    </div>

    <!-- 검색 창 -->
    <input type="text" id="giftSearchInput" class="search-input" placeholder="아이템 이름, 설명, 교수님 이름으로 검색..." oninput="filterGiftTable()" />

    <!-- 가로 표 영역 -->
    <div class="gift-table-container">
      <table class="gift-table">
        <thead>
          <tr>
            <th style="width: 25%;">아이템 이름</th>
            <th style="width: 55%;">아이템 설명</th>
            <th style="width: 20%;">선물 대상 교수</th>
          </tr>
        </thead>
        <tbody id="giftTableBody">
          <!-- 선물 데이터가 가로 행(tr)으로 추가됩니다 -->
        </tbody>
      </table>
    </div>
  </div>

  <!-- 선물 등록 모달 팝업 -->
  <div id="giftModal" class="modal-backdrop" style="display: none;">
    <div class="modal-box">
      <h3>선물 공략 정보 등록</h3>
      <input type="text" id="inputItemName" placeholder="아이템 이름 (예: 반짝이는 허브)" />
      <textarea id="inputItemDesc" placeholder="아이템 설명 (예: 숲 속 깊은 곳에서 채집 가능)"></textarea>
      <input type="text" id="inputProfessor" placeholder="선물 대상 교수 (예: 하르바 교수)" />
      <div class="modal-btns">
        <button class="btn-cancel" onclick="closeGiftModal()">취소</button>
        <button class="btn-save" onclick="saveGiftData()">저장하기</button>
      </div>
    </div>
  </div>

  <script>
    // 1. 노크세르 파이어베이스 초기화 (nokser-1d179)
    const firebaseConfig = {
      projectId: "nokser-1d179"
    };
    if (!firebase.apps.length) {
      firebase.initializeApp(firebaseConfig);
    }
    const db = firebase.firestore();

    // 2. 탭 전환 로직
    function switchTab(sectionId, btnEl) {
      document.querySelectorAll('.content-section').forEach(sec => sec.classList.remove('active'));
      document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));

      document.getElementById(sectionId).classList.add('active');
      btnEl.classList.add('active');

      if (sectionId === 'giftSection') {
        loadGiftTableData();
      } else if (sectionId === 'magicSection') {
        loadMagicData();
      } else if (sectionId === 'alchemySection') {
        loadAlchemyData();
      }
    }

    // 3. 🎁 교수별 선물 공략 데이터 불러오기 및 표(Table)에 출력
    async function loadGiftTableData() {
      const tbody = document.getElementById('giftTableBody');
      tbody.innerHTML = '<tr><td colspan="3" style="text-align:center;">데이터를 불러오는 중...</td></tr>';

      try {
        const snapshot = await db.collection('knoxer_gifts').get();
        tbody.innerHTML = '';

        if (snapshot.empty) {
          tbody.innerHTML = '<tr><td colspan="3" style="text-align:center; color:#888;">등록된 선물 공략이 없습니다. 오른쪽 상단 버튼을 눌러 추가해 보세요!</td></tr>';
          return;
        }

        snapshot.forEach(doc => {
          const data = doc.data();
          const tr = document.createElement('tr');
          tr.className = 'gift-row';
          tr.innerHTML = `
            <td class="item-name-text">📦 ${data.itemName || '이름 없음'}</td>
            <td class="item-desc-text">${data.description || '-'}</td>
            <td><span class="prof-badge">👨‍🏫 ${data.professor || '미지정'}</span></td>
          `;
          tbody.appendChild(tr);
        });
      } catch (err) {
        console.error("선물 데이터 로드 오류:", err);
        tbody.innerHTML = '<tr><td colspan="3" style="text-align:center; color:#f87171;">데이터 불러오기 실패!</td></tr>';
      }
    }

    // 4. 모달 관련 함수
    function openGiftModal() {
      document.getElementById('giftModal').style.display = 'flex';
    }
    function closeGiftModal() {
      document.getElementById('giftModal').style.display = 'none';
    }

    // 5. 새 선물 데이터 저장
    async function saveGiftData() {
      const itemName = document.getElementById('inputItemName').value.trim();
      const description = document.getElementById('inputItemDesc').value.trim();
      const professor = document.getElementById('inputProfessor').value.trim();

      if (!itemName || !professor) {
        alert('아이템 이름과 교수님 이름은 필수 입력 항목입니다!');
        return;
      }

      try {
        await db.collection('knoxer_gifts').add({
          itemName,
          description,
          professor,
          createdAt: firebase.firestore.FieldValue.serverTimestamp()
        });

        alert('성공적으로 등록되었습니다!');
        closeGiftModal();
        document.getElementById('inputItemName').value = '';
        document.getElementById('inputItemDesc').value = '';
        document.getElementById('inputProfessor').value = '';
        loadGiftTableData(); // 표 즉시 새로고침
      } catch (err) {
        console.error("저장 오류:", err);
        alert('저장 실패: ' + err.message);
      }
    }

    // 6. 실시간 테이블 검색 기능
    function filterGiftTable() {
      const keyword = document.getElementById('giftSearchInput').value.toLowerCase();
      const rows = document.querySelectorAll('.gift-row');

      rows.forEach(row => {
        const text = row.textContent.toLowerCase();
        row.style.display = text.includes(keyword) ? '' : 'none';
      });
    }

    // 7. 기존 마법/연금술 데이터 불러오기 (기본 함수)
    async function loadMagicData() {
      const grid = document.getElementById('magicCardGrid');
      try {
        const snap = await db.collection('knoxer_magics').get();
        grid.innerHTML = snap.empty ? '<p style="color:#888;">마법 데이터가 없습니다.</p>' : '';
        snap.forEach(doc => {
          const d = doc.data();
          grid.innerHTML += `<div class="data-card"><h4>${d.title || d.name || '마법'}</h4><p>${d.condition || d.desc || ''}</p></div>`;
        });
      } catch(e) {}
    }

    async function loadAlchemyData() {
      const grid = document.getElementById('alchemyCardGrid');
      try {
        const snap = await db.collection('knoxer_alchemys').get();
        grid.innerHTML = snap.empty ? '<p style="color:#888;">연금술 데이터가 없습니다.</p>' : '';
        snap.forEach(doc => {
          const d = doc.data();
          grid.innerHTML += `<div class="data-card"><h4>${d.title || d.name || '연금술'}</h4><p>${d.recipe || d.desc || ''}</p></div>`;
        });
      } catch(e) {}
    }

    // 첫 진입 시 초기화
    loadMagicData();
  </script>
</body>
</html>
